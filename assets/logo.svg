<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="ScamCheck logo">
  <title>ScamCheck</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14213d"/>
      <stop offset="1" stop-color="#0b1324"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3a68"/>
      <stop offset="1" stop-color="#152a4d"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- shield -->
  <path d="M128 30 L204 58 V122 C204 172 172 206 128 226 C84 206 52 172 52 122 V58 Z" fill="url(#shield)" stroke="#5b8def" stroke-width="6" stroke-linejoin="round"/>
  <!-- gauge bands (centre 128,150, radius 52) -->
  <g fill="none" stroke-width="14" stroke-linecap="butt">
    <path d="M76 150 A52 52 0 0 1 82.9 124" stroke="#2f9e44"/>
    <path d="M84.3 121.7 A52 52 0 0 1 108.4 101.8" stroke="#f2c200"/>
    <path d="M110.9 100.9 A52 52 0 0 1 166.8 115.6" stroke="#f76707"/>
    <path d="M168.6 117.7 A52 52 0 0 1 180 150" stroke="#e03131"/>
  </g>
  <!-- needle pointing to the red zone -->
  <line x1="128" y1="150" x2="163" y2="118" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <circle cx="128" cy="150" r="10" fill="#ffffff"/>
  <!-- check mark -->
  <path d="M104 182 L122 198 L154 168" fill="none" stroke="#7ee2a8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
